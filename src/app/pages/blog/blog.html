<div class="max-w-7xl mx-auto px-6 sm:px-12 py-8 text-neutral-200 w-full">
  <!-- Back Button aligned with logo -->
  <div class="mb-8">
    <a
      routerLink="/me"
      class="inline-flex items-center gap-2 text-xs sm:text-sm font-medium font-coloring2 hover:text-white transition-colors cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
      Back to Home
    </a>
  </div>

  @if (loading()) {
  <div class="flex items-center justify-center py-20 text-neutral-400 text-sm">Loading post...</div>
  } @if (postHtml() && !loading()) {
  <article
    class="prose prose-invert max-w-none break-words overflow-wrap-anywhere prose-headings:font-light prose-a:text-emerald-400 hover:prose-a:underline"
    [innerHTML]="postHtml()"
  ></article>
  }
</div>
