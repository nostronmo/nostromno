<div class="min-h-screen flex flex-col">
  <app-metaballs class="w-full overflow-hidden pointer-events-none" />
  @if (showLayout()) {
  <app-header class="sticky top-0 z-50" />
  }

  <main
    [class.min-h-screen]="!showLayout()"
    [class.min-h-calc]="showLayout()"
    class="flex flex-col grow z-10"
  >
    <router-outlet />
  </main>

  @if (showLayout()) {
  <app-footer />
  }
</div>
